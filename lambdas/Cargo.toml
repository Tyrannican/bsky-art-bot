[workspace]
resolver = "3"
members = ["datafetcher", "bsky-poster-rs", "datafetcher-processor"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
flate2 = "1.1.9"
openssl = { version = "0.10.68", features = ["vendored"] }
scryone = "0.2.5"
serde_json = "1.0.143"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0.99"
aws-config = "1.13.2"
aws-sdk-dynamodb = "1.90.0"
aws-sdk-s3 = "1.103.0"
aws-sdk-secretsmanager = "1.86.0"
aws-sdk-sqs = "1.121.0"
aws_lambda_events = "1.2.1"
aws-types = "1.3.8"
jacquard = "0.12.1"
lambda_runtime = "0.14.4"
rand = "0.9.2"
reqwest = "0.12.23"
smol_str = "0.3.6"
futures = "0.3.34"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
